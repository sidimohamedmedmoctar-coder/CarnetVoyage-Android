# ===== Application =====
spring.application.name=carnet-voyage-backend
server.port=8080

# ===== Base de données MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/carnet_voyage?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=newuser
spring.datasource.password=NewPass2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Upload de fichiers =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ===== Logs =====
logging.level.org.springframework.security=DEBUG

# ===== JWT =====
app.jwt.secret=ChangeCetteCleSecreteParUneVraieCleTresLongueDeMinimum64CaracteresPourLaSecuriteHS512
app.jwt.expiration-ms=86400000